id: TC-06
name: Encryption-behavior simulator
technique: T1486
atomic_ref: custom simulator
command: 'python encrypt_sim.py --target C:\Users\labuser\Documents\simulator_sandbox --files 50'
expected_rule_ids:
  - 100102
  - 100121
expected_level: 15
cleanup: 'python encrypt_sim.py --target C:\Users\labuser\Documents\simulator_sandbox --rollback'
notes: >
  Bundled simulator, not Atomic T1486. Creates RANSOM_NOTE.txt and *.locked
  (Sysmon EID 11) so 100102 fires at level 15 and starts isolate-host.
  The target sits under the lab user's local Documents folder so the
  fifty creates (plus their .sim_backup copies) match support rule 100120
  and raise burst rule 100121 (level 15, same AR). A target outside
  Desktop/Documents/Downloads/Pictures cannot raise 100121. Target must be
  an empty sandbox; see simulator/README.md. After isolation, run
  isolate-host.ps1 -Rollback separately. Matches sample_events/TC-06.
